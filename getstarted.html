<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="mypresets.css">
    <link rel="stylesheet" href="getstarted.css">
    <title>Sign Up-TrinityHospital</title>
</head>
<body class="body">
    <header class="heading-text" style="justify-content: center;"><span>Sign Up</span> - Trinity Hospital</header>
    <main class="signupbox container">
        <form>
            <div class="box">
            <input type="text" placeholder="First Name" minlength="2" required><br><br>
            <input type="text" placeholder="Last Name" minlength="2" required><br><br>
            <input type="email" placeholder="mail@email.com" required><br><br>
            <input type="number" placeholder="Phone Number" required><br><br>
            <input type="password" placeholder="password" minlength="8" maxlength="15" required><br><br>
            <input type="submit">
            </div>
            
        </form>
    </main>
</body>
</html>
